name: Device Block Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-device-block:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: temp_root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Initialize Database
      run: |
        PGPASSWORD=temp_root psql -h localhost -U postgres -c "CREATE DATABASE lifedrop_test_block_ci;"
        PGPASSWORD=temp_root psql -h localhost -U postgres -d lifedrop_test_block_ci -c "CREATE EXTENSION postgis;"
        PGPASSWORD=temp_root psql -h localhost -U postgres -c "CREATE USER test_user WITH PASSWORD 'test_pass' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;"
        PGPASSWORD=temp_root psql -h localhost -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE lifedrop_test_block_ci TO test_user;"
        PGPASSWORD=temp_root psql -h localhost -U postgres -d lifedrop_test_block_ci -c "GRANT ALL ON SCHEMA public TO test_user;"

    - name: Run Device Block Test
      env:
        TEST_DATABASE_URL: "Host=localhost;Port=5432;Database=lifedrop_test_block_ci;Username=test_user;Password=test_pass;Include Error Detail=true"
      run: |
        set -euo pipefail
        dotnet test tests/LifeDrop.Database.Tests/LifeDrop.Database.Tests.csproj \
          --filter "FullyQualifiedName=LifeDrop.Database.Tests.RoleAssignmentDatabaseTests.MigrationEnforcesPermissionsTenantBoundaryAndAudit" \
          --logger "trx;LogFileName=test_results.trx" \
          --results-directory tests/LifeDrop.Database.Tests/TestResults
        python3 - <<'PY'
        import xml.etree.ElementTree as ET
        path = 'tests/LifeDrop.Database.Tests/TestResults/test_results.trx'
        root = ET.parse(path).getroot()
        ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
        counters = root.find('.//t:Counters', ns)
        if counters is None:
            raise SystemExit('TRX counters missing')
        result = {key: int(counters.attrib.get(key, '0')) for key in ('total', 'passed', 'failed', 'notExecuted')}
        print('Focused test counts:', result)
        if result != {'total': 1, 'passed': 1, 'failed': 0, 'notExecuted': 0}:
            raise SystemExit('Expected exactly one passed test and no skipped or failed tests')
        PY

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: tests/LifeDrop.Database.Tests/TestResults/test_results.trx
        if-no-files-found: error
