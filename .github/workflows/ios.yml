name: iOS

# Manual / gated: the macOS runner is slow and costly, so it never runs on every push.
#  - PR label `ios`           -> build + sign + verify the IPA
#  - PR label `ios-testflight`-> same, then upload to TestFlight (internal testers only)
#  - Actions > iOS > Run workflow (needs this file on the default branch), tick the box to upload.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload the IPA to TestFlight'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ios') ||
      contains(github.event.pull_request.labels.*.name, 'ios-testflight')
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_testflight) || contains(github.event.pull_request.labels.*.name, 'ios-testflight') }}
    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Select Xcode 26.6
      run: |
        xcodebuild -version
        if ! xcodebuild -version | grep -q 'Xcode 26\.6'; then
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "::error::Xcode 26.6 not found on this runner image; the pinned iOS workload needs it."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
        fi
        xcodebuild -version

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Pinned workload set: newer sets carry iOS 27.0 which needs Xcode 27 (not on the image). Set 10.0.401 = iOS 26.5 + MAUI 10.0.20.
    - name: Install MAUI iOS workload (pinned set)
      run: |
        dotnet workload install maui-ios --version 10.0.401
        dotnet --version
        dotnet workload list

    - name: Import Apple Distribution certificate
      uses: apple-actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

    - name: Install and validate provisioning profile
      id: profile
      env:
        APPLE_PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_BASE64 }}
      run: python3 scripts/ci/ios/install_profile.py

    - name: Pick signing identity matching the profile
      run: python3 scripts/ci/ios/pick_identity.py

    # Push messages need the app's Firebase file (docs/IOS.md). A build that is not uploaded may use a dummy file, only to prove the push code compiles; an upload needs the real one.
    - name: Add Firebase config (push)
      env:
        PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
      run: |
        plist=src/LifeDrop.Mobile/GoogleService-Info.plist
        if [ -z "$PLIST_B64" ]; then
          if [ "$UPLOAD" = "true" ]; then
            echo "::error::IOS_GOOGLE_SERVICE_INFO_BASE64 is not set; an uploaded build must have the real Firebase file (docs/IOS.md)."
            exit 1
          fi
          echo "::warning::IOS_GOOGLE_SERVICE_INFO_BASE64 is not set: using a dummy Firebase file (compile check only, never uploaded)."
          cat > "$plist" <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
        <key>API_KEY</key><string>ci-dummy-key</string>
        <key>GCM_SENDER_ID</key><string>000000000000</string>
        <key>BUNDLE_ID</key><string>com.pixelo.geotrack</string>
        <key>PROJECT_ID</key><string>lifedrop-ci</string>
        <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
        </dict></plist>
        PLIST
        else
          echo "$PLIST_B64" | base64 --decode > "$plist"
        fi
        bundle=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$plist") || { echo "::error::IOS_GOOGLE_SERVICE_INFO_BASE64 is not a valid plist"; exit 1; }
        if [ "$bundle" != "com.pixelo.geotrack" ]; then
          echo "::error::GoogleService-Info.plist is for '$bundle', expected com.pixelo.geotrack"
          exit 1
        fi

    - name: Build, sign and package IPA
      run: |
        dotnet publish src/LifeDrop.Mobile/LifeDrop.Mobile.csproj \
          -f net10.0-ios \
          -c Release \
          -p:LifeDropIosOnly=true \
          -p:LifeDropMauiVersion=10.0.20 \
          -p:ApplicationVersion=${{ github.run_number }} \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:CodesignKey="$CODESIGN_KEY" \
          -p:CodesignProvision="${{ steps.profile.outputs.uuid }}"

    - name: Verify IPA
      id: ipa
      run: bash scripts/ci/ios/verify_ipa.sh com.pixelo.geotrack "${{ steps.profile.outputs.uuid }}"

    - name: Check App Store Connect secrets
      if: env.UPLOAD == 'true'
      env:
        ISSUER: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        KEYID: ${{ secrets.APPLE_ASC_KEY_ID }}
        PRIVKEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
      run: |
        echo "$ISSUER" | grep -Eq '^[0-9a-fA-F-]{36}$' || { echo "::error::APPLE_ASC_ISSUER_ID must be a UUID"; exit 1; }
        echo "$KEYID" | grep -Eq '^[A-Z0-9]{10}$' || { echo "::error::APPLE_ASC_KEY_ID must be 10 letters/digits"; exit 1; }
        echo "$PRIVKEY" | grep -q 'BEGIN PRIVATE KEY' || { echo "::error::APPLE_ASC_PRIVATE_KEY must contain the full .p8 text"; exit 1; }

    - name: Upload to TestFlight
      if: env.UPLOAD == 'true'
      uses: apple-actions/upload-testflight-build@v5
      with:
        app-path: ${{ steps.ipa.outputs.ipa }}
        app-type: ios
        issuer-id: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        api-key-id: ${{ secrets.APPLE_ASC_KEY_ID }}
        api-private-key: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        uses-non-exempt-encryption: 'false'
        wait-for-processing: 'true'
