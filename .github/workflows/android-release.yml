name: Android release

# Manual only: Actions > Android release > Run workflow. Builds the signed app bundle (.aab) that Google Play wants and keeps it for one day as a download on the run page.
# Needs these secrets (docs/ANDROID.md): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_GOOGLE_SERVICES_JSON_BASE64.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    - name: Ensure Android platform 36
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

    - name: Write signing key and Firebase file
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        GOOGLE_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_B64; do
          if [ -z "${!name}" ]; then echo "::error::The secret for $name is missing (docs/ANDROID.md)."; exit 1; fi
        done
        echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
        keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
          || { echo "::error::The keystore, its password or the alias is wrong."; exit 1; }
        echo "$GOOGLE_B64" | base64 --decode > src/LifeDrop.Mobile/google-services.json
        python3 - <<'PY'
        import json, sys
        d = json.load(open("src/LifeDrop.Mobile/google-services.json"))
        packages = [c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])]
        if "com.pixelo.geotrack" not in packages:
            sys.exit("::error::google-services.json is for " + ", ".join(packages) + ", expected com.pixelo.geotrack")
        if d["project_info"]["project_id"] == "lifedrop-ci":
            sys.exit("::error::google-services.json is the CI dummy, not the real Firebase file")
        PY

    # Play needs a higher version code with every upload: 1000 + run number x 10 + attempt (same rule as the iOS build number).
    - name: Build signed app bundle
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        dotnet publish src/LifeDrop.Mobile/LifeDrop.Mobile.csproj \
          -f net10.0-android \
          -c Release \
          -p:AndroidSdkDirectory="$ANDROID_HOME" \
          -p:AndroidPackageFormat=aab \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore" \
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
          -p:LifeDropBaseDomain=lifegeotracking.com \
          -p:ApplicationVersion=$((1000 + ${{ github.run_number }} * 10 + ${{ github.run_attempt }}))

    - name: Find the bundle
      id: aab
      run: |
        file=$(find src/LifeDrop.Mobile/bin/Release -name '*-Signed.aab' | head -1)
        [ -n "$file" ] || { echo "::error::No signed .aab was produced."; find src/LifeDrop.Mobile/bin/Release -name '*.aab'; exit 1; }
        echo "Bundle: $file ($(du -h "$file" | cut -f1))"
        jarsigner -verify "$file" | head -3 || true
        echo "path=$file" >> "$GITHUB_OUTPUT"

    # Play warnings "no deobfuscation file" and "no debug symbols": collect the R8 mapping file and the native libraries of the build. Neither is inside the .aab, so they are uploaded by hand
    # in Play Console (App bundle explorer > Downloads, per version code). Missing files only give a warning here: the bundle itself is already built.
    - name: Collect mapping file and native debug symbols
      run: |
        out="$RUNNER_TEMP/symbols"
        mkdir -p "$out/native"
        map=$(find src/LifeDrop.Mobile -name 'mapping.txt' -type f | head -1)
        if [ -n "$map" ]; then cp "$map" "$out/mapping.txt"; echo "Mapping file: $map ($(du -h "$map" | cut -f1))"
        else echo "::warning::No R8 mapping.txt was produced (R8 shrinking is probably off, then there is nothing to deobfuscate and the Play warning can be ignored)."; fi
        # The native libraries are inside the bundle (base/lib/<abi>/*.so); Play wants them as a zip with one folder per ABI.
        unzip -q -o "${{ steps.aab.outputs.path }}" 'base/lib/*' -d "$RUNNER_TEMP/aab-libs" || true
        if [ -d "$RUNNER_TEMP/aab-libs/base/lib" ]; then
          cp -r "$RUNNER_TEMP/aab-libs/base/lib/." "$out/native/"
          (cd "$out/native" && zip -qr ../native-debug-symbols.zip .)
          echo "Native libraries: $(find "$out/native" -name '*.so' | wc -l)"
        else echo "::warning::No native libraries found in the bundle."; fi
        ls -la "$out"

    - name: Keep mapping and symbols for one day
      uses: actions/upload-artifact@v7
      with:
        name: lifedrop-android-symbols
        path: |
          ${{ runner.temp }}/symbols/mapping.txt
          ${{ runner.temp }}/symbols/native-debug-symbols.zip
        retention-days: 1
        if-no-files-found: warn

    # The repository is public: keep the file only one day, then it is deleted.
    - name: Keep the bundle for one day
      uses: actions/upload-artifact@v7
      with:
        name: lifedrop-android-bundle
        path: ${{ steps.aab.outputs.path }}
        retention-days: 1
        if-no-files-found: error
