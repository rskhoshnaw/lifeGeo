name: Build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.scripts/**'
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LICENSE
      - README.md

  workflow_call:
    inputs:
      build-artifacts:
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore solution
      run: dotnet restore LifeDrop.CI.slnf

    - name: Build solution
      run: dotnet build LifeDrop.CI.slnf --no-restore --configuration Release

    - name: Test solution
      run: dotnet test LifeDrop.CI.slnf --no-build --configuration Release

  # The MAUI app is not in LifeDrop.CI.slnf (it needs the Android workload). GitHub's Ubuntu runners ship the
  # Android SDK and a JDK, so this job builds the real Android app to catch compile and XAML errors (step 1.10).
  mobile-android:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    - name: Ensure Android platform 36
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

    # A dummy Firebase config (never the owner's) so the push code (plan step 2.14) is compiled too; builds without the file skip it.
    - name: Dummy Firebase config
      run: |
        cat > src/LifeDrop.Mobile/google-services.json <<'JSON'
        {"project_info":{"project_number":"000000000000","project_id":"lifedrop-ci","storage_bucket":"lifedrop-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.pixelo.geotrack"}},"api_key":[{"current_key":"ci-dummy-key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
        JSON

    - name: Build Android app
      run: dotnet build src/LifeDrop.Mobile/LifeDrop.Mobile.csproj -f net10.0-android --configuration Release -p:AndroidSdkDirectory="$ANDROID_HOME"

  # iOS app built on macOS, signed with Apple Distribution certificate, uploaded to TestFlight.
  mobile-ios:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI iOS workload
      run: dotnet workload install maui-ios

    - name: Import Apple Distribution certificate
      uses: apple-actions/import-codesign-certs@v3
      with:
        p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

    - name: Install provisioning profile
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "${{ secrets.APPLE_PROVISION_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/GeoTrack.mobileprovision

    - name: Build and publish iOS app
      run: |
        dotnet publish src/LifeDrop.Mobile/LifeDrop.Mobile.csproj \
          -f net10.0-ios \
          -c Release \
          -p:TargetFrameworks=net10.0-ios \
          -p:ApplicationVersion=${{ github.run_number }} \
          -p:ArchiveOnBuild=true \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:CodesignKey="Apple Distribution: Rasul Saleh (R285PY37J5)" \
          -p:CodesignProvision="GeoTrack Pixelo AppStore"

    - name: Upload to TestFlight
      uses: apple-actions/upload-testflight-build@v3
      with:
        app-path: src/LifeDrop.Mobile/bin/Release/net10.0-ios/ios-arm64/publish/LifeDrop.Mobile.ipa
        issuer-id: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        api-key-id: ${{ secrets.APPLE_ASC_KEY_ID }}
        api-private-key: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}

  # Web panel (plan step 1.16, decisions D10, D12): lint, type check, tests and production build.
  web:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/LifeDrop.Web

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: src/LifeDrop.Web/package-lock.json

    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run build
