# Production on one server (docs/DEPLOY.md): PostgreSQL+PostGIS, the API and Caddy (HTTPS). Only Caddy publishes ports; the database and the API are
# reachable inside the compose network alone. Settings come from deploy/.env (copy .env.example; never commit it).
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    # Sized for a 4-8 GB server and about 50 field users; times are stored in UTC.
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=2GB -c work_mem=8MB -c maintenance_work_mem=128MB
      -c max_connections=100 -c timezone=UTC -c log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__LifeDrop: Host=db;Port=5432;Database=lifedrop;Username=lifedrop_app;Password=${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
      Jwt__Issuer: ${JWT_ISSUER:-lifedrop}
      Jwt__Audience: ${JWT_AUDIENCE:-lifedrop-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in deploy/.env (at least 32 characters)}
      Cors__AllowedOrigins__0: ${PANEL_ORIGIN:?set PANEL_ORIGIN in deploy/.env, for example https://panel.example.com}
      ForwardedHeaders__Enabled: "true"
      RateLimit__PerMinute: ${RATE_LIMIT_PER_MINUTE:-600}
      Tracking__RetentionDays: ${TRACKING_RETENTION_DAYS:-30}
      Metrics__Token: ${METRICS_TOKEN:-}
      Company__Industry: ${COMPANY_INDUSTRY:-pharma}
      Branding__SupportPhone: ${SUPPORT_PHONE:-+9647722656566}
      Push__Fcm__ServiceAccountFile: /run/fcm/service-account.json
      # Telegram for staff (docs/CHANNELS.md): off unless CHANNELS_ENABLED=true and a bot token is set in deploy/.env.
      Channels__Enabled: ${CHANNELS_ENABLED:-false}
      Channels__Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Channels__Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
      Channels__Language: ${CHANNELS_LANGUAGE:-ckb}
    volumes:
      # Put the Firebase key in deploy/secrets/service-account.json to turn push on (docs/PUSH.md); without the file push stays off.
      - ./secrets:/run/fcm:ro
    healthcheck:
      # bash, not the default sh (dash): /dev/tcp is a bash feature, so with CMD-SHELL the check always failed and the API showed "unhealthy".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 15s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env, for example api.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
